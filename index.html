<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drop Calculator PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#0b0f1a;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
    padding:10px;
}

#map{
    height:75vh;
}

.panel{
    text-align:center;
    padding:10px;
}

button{
    padding:10px;
    margin:5px;
    background:#00ffcc;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🎯 Drop Calculator PRO (God System)</h1>

<div id="map"></div>

<div class="panel">
    <button onclick="toggleBusMode()">✈️ Definir rota</button>
    <button onclick="animarOnibus()">▶️ Iniciar ônibus</button>
    <div id="resultado"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>

<script>

// ================= MAPA =================
let map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom:-2,
    maxZoom:2
});

let bounds = [[0,0],[2048,2048]];
L.imageOverlay("mapa.jpg", bounds).addTo(map);
map.fitBounds(bounds);

// ================= VARIÁVEIS =================
let busStart = null;
let busEnd = null;
let busLine = null;
let decorator = null;

let markerDrop = null;
let linhaOtima = null;
let pontoPulo = null;
let pontoMergulho = null;

let modoOnibus = false;

let busMarker = null;
let busProgress = 0;
let animando = false;

// ================= CLIQUE =================
map.on('click', function(e){

    if(modoOnibus){

        if(!busStart){
            busStart=[e.latlng.lat,e.latlng.lng];
            L.marker(busStart).addTo(map);
        }else{
            busEnd=[e.latlng.lat,e.latlng.lng];
            L.marker(busEnd).addTo(map);
            desenharLinha();
            modoOnibus=false;
        }
        return;
    }

    setDrop(e.latlng);
});

// ================= FUNÇÕES =================

function setDrop(latlng){

    if(markerDrop) map.removeLayer(markerDrop);
    markerDrop = L.marker(latlng).addTo(map);

    desenharRotaOtima(latlng);
    calcular();
}

function toggleBusMode(){
    modoOnibus = true;
    busStart=null;
    busEnd=null;

    if(busLine) map.removeLayer(busLine);
    if(decorator) map.removeLayer(decorator);

    alert("Clique em 2 pontos para definir a rota do ônibus");
}

function desenharLinha(){

    if(busLine) map.removeLayer(busLine);
    if(decorator) map.removeLayer(decorator);

    busLine = L.polyline([busStart,busEnd],{
        color:'cyan',weight:3
    }).addTo(map);

    decorator = L.polylineDecorator(busLine,{
        patterns:[{
            offset:'5%',
            repeat:'10%',
            symbol:L.Symbol.arrowHead({
                pixelSize:10,
                pathOptions:{color:'white'}
            })
        }]
    }).addTo(map);
}

// ================= ROTA OTIMIZADA =================

function desenharRotaOtima(drop){

    if(!busStart || !busEnd) return;

    let p = pontoMaisProximo(drop, busStart, busEnd);

    if(linhaOtima) map.removeLayer(linhaOtima);
    if(pontoPulo) map.removeLayer(pontoPulo);
    if(pontoMergulho) map.removeLayer(pontoMergulho);

    // linha
    linhaOtima = L.polyline([
        [p.lat, p.lng],
        [drop.lat, drop.lng]
    ], {
        color: 'lime',
        weight: 3,
        dashArray: "8,8"
    }).addTo(map);

    // 🔴 pulo
    pontoPulo = L.circleMarker([p.lat, p.lng], {
        radius:6,
        color:'red',
        fillColor:'red',
        fillOpacity:1
    }).addTo(map);

    // 🔵 mergulho (INTELIGENTE)
    let mergulho = calcularPontoMergulho(drop, p);

    pontoMergulho = L.circleMarker([mergulho.lat, mergulho.lng], {
        radius:7,
        color:'blue',
        fillColor:'blue',
        fillOpacity:1
    }).addTo(map);
}

// ================= MERGULHO INTELIGENTE =================

function calcularPontoMergulho(drop, pontoPulo){

    let dx = drop.lat - pontoPulo.lat;
    let dy = drop.lng - pontoPulo.lng;

    let distTotal = Math.sqrt(dx*dx + dy*dy);

    if(distTotal === 0) return drop;

    let nx = dx / distTotal;
    let ny = dy / distTotal;

    // física base
    let altura = 1000;
    let alturaGlider = 300;

    let velQueda = 65;
    let velGlider = 22;

    let tempoQueda = (altura - alturaGlider) / velQueda;
    let distQueda = tempoQueda * velQueda;

    let distPlanar = Math.max(0, distTotal - distQueda);

    // =========================
    // AJUSTE DINÂMICO
    // =========================

    let ajuste = 0;

    if(distTotal > 1200){
        ajuste = 120;
    } else if(distTotal > 800){
        ajuste = 90;
    } else if(distTotal > 500){
        ajuste = 60;
    } else {
        ajuste = 40;
    }

    let fatorTerreno = 0.85;

    let distFinal = (distPlanar * fatorTerreno) + ajuste;

    return {
        lat: drop.lat - (nx * distFinal),
        lng: drop.lng - (ny * distFinal)
    };
}

// ================= ANIMAÇÃO =================

function animarOnibus(){

    if(!busStart||!busEnd){
        alert("Defina a rota primeiro!");
        return;
    }

    if(busMarker) map.removeLayer(busMarker);

    busProgress=0;
    animando=true;

    busMarker = L.circleMarker(busStart,{
        radius:8,
        color:'white',
        fillColor:'cyan',
        fillOpacity:1
    }).addTo(map);

    function mover(){

        if(!animando) return;

        busProgress += 0.002;

        if(busProgress>1){
            animando=false;
            return;
        }

        let lat = busStart[0] + (busEnd[0]-busStart[0])*busProgress;
        let lng = busStart[1] + (busEnd[1]-busStart[1])*busProgress;

        busMarker.setLatLng([lat,lng]);

        requestAnimationFrame(mover);
    }

    mover();
}

// ================= CÁLCULO =================

function distancia(a,b){
    let dx=a.lat-b.lat;
    let dy=a.lng-b.lng;
    return Math.sqrt(dx*dx+dy*dy);
}

function pontoMaisProximo(p,a,b){

    let apx=p.lat-a[0], apy=p.lng-a[1];
    let abx=b[0]-a[0], aby=b[1]-a[1];

    let t=(apx*abx+apy*aby)/(abx*abx+aby*aby);
    t=Math.max(0,Math.min(1,t));

    return {lat:a[0]+abx*t,lng:a[1]+aby*t};
}

function calcular(){

    if(!markerDrop || !busStart || !busEnd) return;

    let drop = markerDrop.getLatLng();
    let p = pontoMaisProximo(drop, busStart, busEnd);

    let escala = 2.5;

    let distTotal = distancia(drop, p) * escala;

    let velQueda = 65;
    let velGlider = 22;

    let tempoQueda = (1000-300)/65;
    let distQueda = tempoQueda * velQueda;

    let restante = Math.max(0, distTotal - distQueda);
    let tempoGlider = restante / velGlider;

    let tempoTotal = tempoQueda + tempoGlider;

    let distBus = distancia(
        {lat:busStart[0], lng:busStart[1]},
        p
    ) * escala;

    let tempoOnibus = distBus / 30;

    document.getElementById("resultado").innerHTML =
        `🎯 GOD DROP<br>
         📏 Distância: ${distTotal.toFixed(0)}m<br>
         ⏱️ Tempo queda: ${tempoTotal.toFixed(2)}s<br>
         ✈️ Pule em: ${tempoOnibus.toFixed(2)}s`;
}

</script>

</body>
</html>

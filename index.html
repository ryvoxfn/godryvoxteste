<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drop Calculator PRO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    background:#0b0f1a;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
    padding:10px;
}

#map{
    height:75vh;
    background:black;
}

.panel{
    padding:15px;
    text-align:center;
}

.result{
    margin-top:10px;
    font-size:16px;
}
</style>
</head>

<body>

<h1>🎯 Drop Calculator PRO (Fortnite)</h1>

<div id="map"></div>

<div class="panel">
    <div class="result" id="resultado"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// =======================
// CONFIG MAPA REAL
// =======================

let mapWidth = 2048;
let mapHeight = 2048;

let map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 2
});

// SUA IMAGEM LOCAL
let imageUrl = "mapa.jpg";

let bounds = [[0,0], [mapHeight, mapWidth]];
L.imageOverlay(imageUrl, bounds).addTo(map);

map.fitBounds(bounds);

// =======================
// ÔNIBUS (rota exemplo)
// =======================

let busStart = [200, 1800];
let busEnd = [1800, 200];

let busLine = L.polyline([busStart, busEnd], {
    color:'cyan',
    weight:3
}).addTo(map);

// =======================
// DROP
// =======================

let markerDrop = null;

map.on('click', function(e){

    console.log("Coord:", e.latlng); // ajuda pra ajustar POIs

    if(markerDrop) map.removeLayer(markerDrop);

    markerDrop = L.marker(e.latlng).addTo(map)
        .bindPopup("📍 Drop escolhido")
        .openPopup();

    calcular();
});

// =======================
// POIs MELHORADOS
// =======================

let pois = [
    {nome:"Brutal Bastion", x:1000, y:400, tipo:"perigo"},
    {nome:"Frenzy Fields", x:1000, y:1200, tipo:"loot"},
    {nome:"Faulty Splits", x:900, y:1000, tipo:"cidade"},
    {nome:"Anvil Square", x:800, y:700, tipo:"cidade"},
    {nome:"Slappy Shores", x:1500, y:800, tipo:"cidade"},
    {nome:"Lonely Labs", x:1700, y:300, tipo:"perigo"}
];

function corPOI(tipo){
    if(tipo === "cidade") return "#00ffcc";
    if(tipo === "loot") return "#ffd700";
    if(tipo === "perigo") return "#ff4d4d";
    return "#ffffff";
}

pois.forEach(p => {

    let cor = corPOI(p.tipo);

    let marker = L.marker([p.x, p.y], {
        icon: L.divIcon({
            html: `
                <div style="
                    background: rgba(0,0,0,0.6);
                    border: 1px solid ${cor};
                    padding:4px 8px;
                    border-radius:8px;
                    color:${cor};
                    font-weight:bold;
                    font-size:13px;
                    text-align:center;
                    transition:0.2s;
                "
                onmouseover="this.style.transform='scale(1.1)'"
                onmouseout="this.style.transform='scale(1)'"
                >
                    ${p.nome}
                </div>
            `,
            iconSize: [120, 30]
        })
    }).addTo(map);

    marker.on('click', function(){

        if(markerDrop) map.removeLayer(markerDrop);

        markerDrop = L.marker([p.x, p.y]).addTo(map)
            .bindPopup("🎯 Drop: " + p.nome)
            .openPopup();

        calcular();
    });

});

// =======================
// FUNÇÕES
// =======================

function distancia(a,b){
    let dx = a.lat - b.lat;
    let dy = a.lng - b.lng;
    return Math.sqrt(dx*dx + dy*dy);
}

function pontoMaisProximo(p,a,b){

    let apx = p.lat - a[0];
    let apy = p.lng - a[1];

    let abx = b[0] - a[0];
    let aby = b[1] - a[1];

    let ab2 = abx*abx + aby*aby;
    let ap_ab = apx*abx + apy*aby;

    let t = Math.max(0, Math.min(1, ap_ab / ab2));

    return {
        lat: a[0] + abx*t,
        lng: a[1] + aby*t
    };
}

// =======================
// CÁLCULO
// =======================

function calcular(){

    if(!markerDrop) return;

    let drop = markerDrop.getLatLng();
    let p = pontoMaisProximo(drop, busStart, busEnd);

    let escala = 2.5;
    let dist = distancia(drop, p) * escala;

    let velQueda = 65;
    let velGlider = 22;
    let altura = 1000;
    let alturaGlider = 300;

    let tempoQueda = (altura - alturaGlider) / velQueda;
    let restante = Math.max(0, dist - (tempoQueda * velQueda));
    let tempoGlider = restante / velGlider;

    let tempoTotal = tempoQueda + tempoGlider;

    let distBus = distancia({lat:busStart[0], lng:busStart[1]}, p) * escala;
    let velBus = 30;

    let tempoOnibus = distBus / velBus;

    document.getElementById("resultado").innerHTML =
        "📏 Distância: " + dist.toFixed(0) + "m<br>" +
        "⏱️ Tempo queda: " + tempoTotal.toFixed(2) + "s<br>" +
        "✈️ Tempo ônibus: " + tempoOnibus.toFixed(2) + "s<br><br>" +
        "🎯 Pule em: " + tempoOnibus.toFixed(2) + "s";
}

</script>

</body>
</html>

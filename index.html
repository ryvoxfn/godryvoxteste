<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drop Calc Pro (IA + Heatmap)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;background:#0b0f1a;color:white;font-family:Arial;}
#map{height:100vh;}

.topbar{
    position:absolute;
    top:0;width:100%;
    display:flex;
    justify-content:space-between;
    padding:10px 20px;
    background:rgba(0,0,0,0.4);
    z-index:1000;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:#00ffc3;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
    <b>🎯 Drop Calc Pro</b>
    <div>
        <button onclick="modoBus()">Ônibus</button>
        <button onclick="gerarHeatmap()">Heatmap</button>
        <button onclick="resetar()">Reset</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ================= MAP =================
let map=L.map('map',{crs:L.CRS.Simple,minZoom:-2,maxZoom:2});
let bounds=[[0,0],[2048,2048]];
L.imageOverlay("mapa.jpg",bounds).addTo(map);
map.fitBounds(bounds);

// ================= HEIGHTMAP =================
let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");
let loaded=false;

let img=new Image();
img.src="heightmap.png";

img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.drawImage(img,0,0);
    loaded=true;
};

function alturaTerreno(lat,lng){
    if(!loaded) return 0;
    let x=(lng/2048)*canvas.width;
    let y=(lat/2048)*canvas.height;
    let v=ctx.getImageData(x,y,1,1).data[0]/255;
    return v*850-20;
}

// ================= IA =================
let IA={
    gravidade:28,
    velAr:36,
    velGlide:27,
    alturaGlide:260,
    alturaInicial:820
};

// ================= VAR =================
let busA=null,busB=null,drop=null;
let linhaBus=null,linhaRota=null;

let jumpMark=null,glideMark=null;
let heatLayers=[];

let setBus=false;

// ================= CLICK =================
map.on('click',e=>{

    if(setBus){
        if(!busA){
            busA=[e.latlng.lat,e.latlng.lng];
            L.marker(busA).addTo(map);
        }else{
            busB=[e.latlng.lat,e.latlng.lng];
            L.marker(busB).addTo(map);

            if(linhaBus) map.removeLayer(linhaBus);
            linhaBus=L.polyline([busA,busB],{color:'cyan'}).addTo(map);

            setBus=false;
        }
        return;
    }

    drop=e.latlng;
    L.marker(drop).addTo(map);

    calcular();
});

// ================= CONTROLES =================
function modoBus(){
    setBus=true;
    busA=null;busB=null;
}

function resetar(){
    location.reload();
}

// ================= SIMULAÇÃO =================
function simular(p){

    let dx=drop.lat-p.lat;
    let dy=drop.lng-p.lng;

    let distTotal=Math.sqrt(dx*dx+dy*dy);
    let dirX=dx/distTotal;
    let dirY=dy/distTotal;

    let t=0,dt=0.016;
    let dist=0,vel=0;

    let glide=false;
    let glidePos=null;

    while(true){

        let lat=p.lat+dirX*dist;
        let lng=p.lng+dirY*dist;

        let terreno=alturaTerreno(lat,lng);

        let altura=IA.alturaInicial-(0.5*IA.gravidade*t*t);
        let rel=altura-terreno;

        if(!glide && rel<IA.alturaGlide){
            glide=true;
            glidePos={lat,lng};
        }

        let alvo=glide?IA.velGlide:IA.velAr;
        vel+=(alvo-vel)*0.06;

        dist+=vel*dt;

        if(altura<=terreno){
            return {final:{lat,lng},glide:glidePos};
        }

        if(t>120) return {final:drop,glide:glidePos};

        t+=dt;
    }
}

// ================= DIST =================
function dist(a,b){
    let dx=a.lat-b.lat;
    let dy=a.lng-b.lng;
    return Math.sqrt(dx*dx+dy*dy);
}

// ================= IA BUSCA =================
function melhorPonto(){

    let melhor=null,erroMin=999999,melhorGlide=null;

    for(let i=0;i<=1;i+=0.02){

        let lat=busA[0]+(busB[0]-busA[0])*i;
        let lng=busA[1]+(busB[1]-busA[1])*i;

        let sim=simular({lat,lng});
        let erro=dist(sim.final,drop);

        if(erro<erroMin){
            erroMin=erro;
            melhor={lat,lng};
            melhorGlide=sim.glide;
        }
    }

    // refinamento
    for(let i=-0.02;i<=0.02;i+=0.002){

        let lat=melhor.lat+(busB[0]-busA[0])*i;
        let lng=melhor.lng+(busB[1]-busA[1])*i;

        let sim=simular({lat,lng});
        let erro=dist(sim.final,drop);

        if(erro<erroMin){
            erroMin=erro;
            melhor={lat,lng};
            melhorGlide=sim.glide;
        }
    }

    return {jump:melhor,glide:melhorGlide};
}

// ================= CALC =================
function calcular(){

    if(!busA||!busB||!drop) return;

    if(linhaRota) map.removeLayer(linhaRota);
    if(jumpMark) map.removeLayer(jumpMark);
    if(glideMark) map.removeLayer(glideMark);

    let best=melhorPonto();

    linhaRota=L.polyline([best.jump,drop],{
        color:'#00e0ff',
        dashArray:'10,10'
    }).addTo(map);

    jumpMark=L.circleMarker(best.jump,{radius:7,color:'red'}).addTo(map);

    if(best.glide){
        glideMark=L.circleMarker(best.glide,{radius:7,color:'lime'}).addTo(map);
    }
}

// ================= HEATMAP =================
function gerarHeatmap(){

    if(!busA||!busB||!drop) return;

    // limpa antigo
    heatLayers.forEach(l=>map.removeLayer(l));
    heatLayers=[];

    for(let i=0;i<=1;i+=0.05){

        let lat=busA[0]+(busB[0]-busA[0])*i;
        let lng=busA[1]+(busB[1]-busA[1])*i;

        let sim=simular({lat,lng});
        let erro=dist(sim.final,drop);

        let cor;

        if(erro<20) cor="red";
        else if(erro<60) cor="yellow";
        else cor="blue";

        let c=L.circleMarker([lat,lng],{
            radius:6,
            color:cor,
            fillOpacity:0.7
        }).addTo(map);

        heatLayers.push(c);
    }
}

</script>
</body>
</html>

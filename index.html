<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drop Calculator (Base)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;background:#0b0f1a;color:white;font-family:Arial;}
h1{text-align:center;padding:10px;}
#map{height:80vh;}
.panel{text-align:center;padding:10px;}
button{
    padding:10px;margin:5px;
    background:#00ffcc;border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🎯 Drop Calculator (Base)</h1>

<div id="map"></div>

<div class="panel">
    <button onclick="ativarModoOnibus()">Definir rota do ônibus</button>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ================= MAPA =================
let map = L.map('map',{crs:L.CRS.Simple,minZoom:-2,maxZoom:2});
let bounds=[[0,0],[2048,2048]];
L.imageOverlay("mapa.jpg",bounds).addTo(map);
map.fitBounds(bounds);

// ================= VAR =================
let busStart=null, busEnd=null;
let modoOnibus=false;

let markerDrop=null;
let pontoPulo=null;
let pontoMergulho=null;
let linha=null;

// ================= CLICK =================
map.on('click', e=>{

    if(modoOnibus){
        if(!busStart){
            busStart=[e.latlng.lat,e.latlng.lng];
            L.marker(busStart).addTo(map);
        }else{
            busEnd=[e.latlng.lat,e.latlng.lng];
            L.marker(busEnd).addTo(map);

            L.polyline([busStart,busEnd],{
                color:'cyan'
            }).addTo(map);

            modoOnibus=false;
        }
        return;
    }

    setDrop(e.latlng);
});

// ================= BUS =================
function ativarModoOnibus(){
    modoOnibus=true;
    busStart=null;
    busEnd=null;
}

// ================= DROP =================
function setDrop(latlng){

    if(markerDrop) map.removeLayer(markerDrop);
    markerDrop=L.marker(latlng).addTo(map);

    calcularRota(latlng);
}

// ================= LÓGICA PRINCIPAL =================
function calcularRota(drop){

    let p = pontoMaisProximo(drop,busStart,busEnd);

    if(pontoPulo) map.removeLayer(pontoPulo);
    if(pontoMergulho) map.removeLayer(pontoMergulho);
    if(linha) map.removeLayer(linha);

    // 🔴 ponto de pulo
    pontoPulo = L.circleMarker([p.lat,p.lng],{
        radius:6,color:'red'
    }).addTo(map);

    // 🔵 ponto de mergulho (base)
    let mergulho = calcularMergulho(drop,p);

    pontoMergulho = L.circleMarker([mergulho.lat,mergulho.lng],{
        radius:7,color:'blue'
    }).addTo(map);

    // linha visual
    linha = L.polyline([
        [p.lat,p.lng],
        [drop.lat,drop.lng]
    ],{
        color:'lime',
        dashArray:'6,6'
    }).addTo(map);
}

// ================= MERGULHO BASE =================
function calcularMergulho(drop,p){

    let dx = drop.lat - p.lat;
    let dy = drop.lng - p.lng;

    let dist = Math.sqrt(dx*dx + dy*dy);

    let nx = dx/dist;
    let ny = dy/dist;

    // parâmetros base
    let altura = 1000;
    let alturaGlider = 300;

    let velQueda = 65;
    let velGlider = 22;

    let tempoQueda = (altura - alturaGlider) / velQueda;

    let distQueda = tempoQueda * velQueda;

    let restante = Math.max(0, dist*2.5 - distQueda);

    let distFinal = restante;

    return {
        lat: drop.lat - nx * distFinal,
        lng: drop.lng - ny * distFinal
    };
}

// ================= UTILS =================
function pontoMaisProximo(p,a,b){

    let apx=p.lat-a[0], apy=p.lng-a[1];
    let abx=b[0]-a[0], aby=b[1]-a[1];

    let t=(apx*abx+apy*aby)/(abx*abx+aby*aby);
    t=Math.max(0,Math.min(1,t));

    return {lat:a[0]+abx*t,lng:a[1]+aby*t};
}

</script>

</body>
</html>

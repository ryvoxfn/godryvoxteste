<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drop Calc PRO (Solver Real)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f1a;
    color:white;
}

.topbar{
    position:absolute;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:10px 20px;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    z-index:1000;
}

.controls button{
    margin-left:10px;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    background:linear-gradient(135deg,#00ffc3,#00aaff);
    font-weight:bold;
    cursor:pointer;
}

#map{
    height:100vh;
    cursor:crosshair;
}

.info{
    position:absolute;
    bottom:20px;
    left:20px;
    background:rgba(0,0,0,0.5);
    padding:15px;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="topbar">
    <h1>🎯 Drop Calc PRO</h1>
    <div class="controls">
        <button onclick="modoBus()">Definir Ônibus</button>
        <button onclick="resetar()">Reset</button>
    </div>
</div>

<div id="map"></div>

<div class="info">
    <p>📍 <span id="coords">-</span></p>
    <p>📏 <span id="erro">-</span></p>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ================= MAP =================
let map = L.map('map',{crs:L.CRS.Simple,minZoom:-2,maxZoom:2});
let bounds=[[0,0],[2048,2048]];
L.imageOverlay("mapa.jpg",bounds).addTo(map);
map.fitBounds(bounds);

// ================= HEIGHTMAP =================
let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");
let loaded=false;

let img=new Image();
img.src="heightmap.png";

img.onload=()=>{
    canvas.width=img.width;
    canvas.height=img.height;
    ctx.drawImage(img,0,0);
    loaded=true;
};

function getTerreno(lat,lng){
    if(!loaded) return 0;

    let x=Math.floor((lng/2048)*canvas.width);
    let y=Math.floor((lat/2048)*canvas.height);

    let val=ctx.getImageData(x,y,1,1).data[0]/255;
    return val * 830 - 30;
}

// ================= VAR =================
let busStart=null,busEnd=null;
let busLine=null;

let markerDrop=null;
let jumpMark=null, glideMark=null;

let modo=false;

// ================= CLICK =================
map.on('click',e=>{

    if(modo){
        if(!busStart){
            busStart=[e.latlng.lat,e.latlng.lng];
            L.marker(busStart).addTo(map);
        }else{
            busEnd=[e.latlng.lat,e.latlng.lng];
            L.marker(busEnd).addTo(map);

            if(busLine) map.removeLayer(busLine);
            busLine=L.polyline([busStart,busEnd],{color:'cyan'}).addTo(map);

            modo=false;
        }
        return;
    }

    setDrop(e.latlng);
});

// ================= CONTROLES =================
function modoBus(){
    modo=true;
    busStart=null;
    busEnd=null;
    if(busLine) map.removeLayer(busLine);
}

function resetar(){
    location.reload();
}

// ================= DIST =================
function dist(a,b){
    let dx=a.lat-b.lat;
    let dy=a.lng-b.lng;
    return Math.sqrt(dx*dx+dy*dy);
}

// ================= SIMULAÇÃO REAL =================
function simular(p, drop){

    let dx = drop.lat - p.lat;
    let dy = drop.lng - p.lng;

    let d = Math.sqrt(dx*dx + dy*dy);
    let dirX = dx/d;
    let dirY = dy/d;

    let t=0,dt=0.016;
    let distPerc=0,vel=0;

    let glide=false, glidePoint=null;

    while(true){

        let lat=p.lat + dirX*distPerc;
        let lng=p.lng + dirY*distPerc;

        // terreno atual + futuro (PRECISÃO)
        let t1=getTerreno(lat,lng);
        let t2=getTerreno(lat+dirX*20,lng+dirY*20);
        let terreno=(t1*0.7 + t2*0.3);

        let altura=800 - (0.5*30*t*t);
        let rel=altura - terreno;

        // GLIDE INTELIGENTE
        let trigger=250 + (terreno*0.05);

        if(!glide && rel<=trigger){
            glide=true;
            glidePoint={lat,lng};
        }

        // VELOCIDADE REALISTA
        let target=glide?26:38;

        if(rel>400) target+=6;
        if(rel<200) target-=4;

        vel += (target - vel) * (glide?0.04:0.07);

        distPerc += vel*dt;

        // IMPACTO REAL
        if(rel<=0){
            return {final:{lat,lng}, glide:glidePoint};
        }

        if(t>120){
            return {final:drop, glide:glidePoint};
        }

        t+=dt;
    }
}

// ================= SOLVER PRECISO =================
function solver(drop,a,b){

    let best=null,err=999999,glide=null;

    for(let i=0;i<=1;i+=0.02){

        let lat=a[0]+(b[0]-a[0])*i;
        let lng=a[1]+(b[1]-a[1])*i;

        let sim=simular({lat,lng},drop);

        let e=dist(sim.final,drop);

        if(e<err){
            err=e;
            best={lat,lng};
            glide=sim.glide;
        }
    }

    return {jump:best, glide, erro:err};
}

// ================= DRAW =================
function setDrop(p){

    if(markerDrop) map.removeLayer(markerDrop);
    markerDrop=L.marker(p).addTo(map);

    draw(p);
}

function draw(drop){

    if(!busStart||!busEnd) return;

    if(jumpMark) map.removeLayer(jumpMark);
    if(glideMark) map.removeLayer(glideMark);

    let data=solver(drop,busStart,busEnd);

    let jump=data.jump;
    let glide=data.glide;

    // JUMP
    jumpMark=L.circleMarker([jump.lat,jump.lng],{
        radius:8,color:'red',fillOpacity:1
    }).addTo(map).bindTooltip("Jump",{permanent:true});

    // GLIDE
    if(glide){
        glideMark=L.circleMarker([glide.lat,glide.lng],{
            radius:8,color:'lime',fillOpacity:1
        }).addTo(map).bindTooltip("Glide",{permanent:true});
    }

    // HUD
    document.getElementById("coords").innerText =
        `${drop.lat.toFixed(0)}, ${drop.lng.toFixed(0)}`;

    document.getElementById("erro").innerText =
        data.erro.toFixed(1)+" m";
}

</script>

</body>
</html>

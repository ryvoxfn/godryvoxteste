<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Drop Calculator PRO (REAL HEIGHT)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{margin:0;background:#0b0f1a;color:white;font-family:Arial;}
h1{text-align:center;padding:10px;}
#map{height:75vh;}
.panel{text-align:center;padding:10px;}
button{
    padding:10px;margin:5px;
    background:#00ffcc;border:none;
    border-radius:6px;cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🎯 Drop Calculator PRO (REAL HEIGHT SYSTEM)</h1>

<div id="map"></div>

<div class="panel">
    <button onclick="toggleBusMode()">✈️ Definir rota</button>
    <div id="resultado"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>

<script>

// ================= MAP =================
let map = L.map('map',{crs:L.CRS.Simple,minZoom:-2,maxZoom:2});
let bounds=[[0,0],[2048,2048]];
L.imageOverlay("mapa.jpg",bounds).addTo(map);
map.fitBounds(bounds);

// ================= HEIGHTMAP =================
let heightCanvas = document.createElement("canvas");
let ctx = heightCanvas.getContext("2d");
let heightLoaded = false;

let img = new Image();
img.src = "heightmap.png";

img.onload = () => {
    heightCanvas.width = img.width;
    heightCanvas.height = img.height;
    ctx.drawImage(img,0,0);
    heightLoaded = true;
};

// pega altura real
function getAltura(lat,lng){
    if(!heightLoaded) return 0.5;

    let x = Math.floor((lng/2048)*heightCanvas.width);
    let y = Math.floor((lat/2048)*heightCanvas.height);

    let pixel = ctx.getImageData(x,y,1,1).data[0];
    return pixel/255;
}

// ================= VAR =================
let busStart=null,busEnd=null;
let busLine=null,decorator=null;
let markerDrop=null,linhaOtima=null;
let pontoPulo=null,pontoMergulho=null;
let modoOnibus=false;

// ================= CLICK =================
map.on('click', e=>{
    if(modoOnibus){
        if(!busStart){
            busStart=[e.latlng.lat,e.latlng.lng];
            L.marker(busStart).addTo(map);
        }else{
            busEnd=[e.latlng.lat,e.latlng.lng];
            L.marker(busEnd).addTo(map);
            desenharLinha();
            modoOnibus=false;
        }
        return;
    }
    setDrop(e.latlng);
});

// ================= BUS =================
function toggleBusMode(){
    modoOnibus=true;
    busStart=null;busEnd=null;
    if(busLine) map.removeLayer(busLine);
    if(decorator) map.removeLayer(decorator);
}

function desenharLinha(){
    busLine=L.polyline([busStart,busEnd],{color:'cyan'}).addTo(map);

    decorator=L.polylineDecorator(busLine,{
        patterns:[{
            offset:'5%',
            repeat:'10%',
            symbol:L.Symbol.arrowHead({pixelSize:10,pathOptions:{color:'white'}})
        }]
    }).addTo(map);
}

// ================= DROP =================
function setDrop(latlng){
    if(markerDrop) map.removeLayer(markerDrop);
    markerDrop=L.marker(latlng).addTo(map);
    desenharRota(latlng);
}

// ================= ROTA =================
function desenharRota(drop){

    let p=pontoMaisProximo(drop,busStart,busEnd);

    if(linhaOtima) map.removeLayer(linhaOtima);
    if(pontoPulo) map.removeLayer(pontoPulo);
    if(pontoMergulho) map.removeLayer(pontoMergulho);

    linhaOtima=L.polyline([[p.lat,p.lng],[drop.lat,drop.lng]],{
        color:'lime',dashArray:'8,8'
    }).addTo(map);

    pontoPulo=L.circleMarker([p.lat,p.lng],{radius:6,color:'red'}).addTo(map);

    let mergulho=calcularMergulhoReal(drop,p);

    pontoMergulho=L.circleMarker([mergulho.lat,mergulho.lng],{
        radius:7,color:'blue'
    }).addTo(map);

    calcularTempo(drop,p,mergulho);
}

// ================= MERGULHO REAL =================
function calcularMergulhoReal(drop,p){

    let dx=drop.lat-p.lat;
    let dy=drop.lng-p.lng;
    let dist=Math.sqrt(dx*dx+dy*dy);

    let nx=dx/dist;
    let ny=dy/dist;

    // altura real
    let altDrop=getAltura(drop.lat,drop.lng);
    let altPulo=getAltura(p.lat,p.lng);

    let diffAlt=altDrop-altPulo;

    // ajuste REAL
    let fator=0.85 - (diffAlt*0.5);

    fator=Math.max(0.4,Math.min(1,fator));

    let distFinal=dist*fator;

    return {
        lat:drop.lat - nx*distFinal,
        lng:drop.lng - ny*distFinal
    };
}

// ================= TEMPO =================
function calcularTempo(drop,p,mergulho){

    let escala=2.5;

    let distTotal=distancia(drop,p)*escala;

    let alturaDrop=getAltura(drop.lat,drop.lng);

    let alturaReal=1000 + (alturaDrop*500);

    let tempoQueda=(alturaReal-300)/65;

    let restante=Math.max(0,distTotal-(tempoQueda*65));
    let tempoGlider=restante/22;

    let tempoTotal=tempoQueda+tempoGlider;

    let tempoBus=distancia(
        {lat:busStart[0],lng:busStart[1]},
        p
    )/30;

    document.getElementById("resultado").innerHTML=
        `🎯 GOD DROP REAL<br>
         ⏱️ Tempo total: ${tempoTotal.toFixed(2)}s<br>
         🚀 SPACE perfeito: ${tempoBus.toFixed(2)}s`;
}

// ================= UTILS =================
function distancia(a,b){
    let dx=a.lat-b.lat;
    let dy=a.lng-b.lng;
    return Math.sqrt(dx*dx+dy*dy);
}

function pontoMaisProximo(p,a,b){
    let apx=p.lat-a[0],apy=p.lng-a[1];
    let abx=b[0]-a[0],aby=b[1]-a[1];

    let t=(apx*abx+apy*aby)/(abx*abx+aby*aby);
    t=Math.max(0,Math.min(1,t));

    return {lat:a[0]+abx*t,lng:a[1]+aby*t};
}

</script>

</body>
</html>
